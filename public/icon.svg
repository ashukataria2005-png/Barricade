<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181c" />
      <stop offset="50%" stop-color="#121215" />
      <stop offset="100%" stop-color="#0a0a0d" />
    </linearGradient>

    <!-- Wall Glow Filter -->
    <filter id="wallGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Pawn Glows -->
    <filter id="redGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="blueGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Barricade Beam Gradient -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Blue Pawn Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Red Pawn Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>

  <!-- App Rounded Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#27272a" stroke-width="6" />

  <!-- Inner Ambient Glow -->
  <circle cx="256" cy="130" r="110" fill="#3b82f6" opacity="0.12" filter="blur(40px)" />
  <circle cx="256" cy="382" r="110" fill="#ef4444" opacity="0.12" filter="blur(40px)" />
  <circle cx="256" cy="256" r="90" fill="#f59e0b" opacity="0.15" filter="blur(30px)" />

  <!-- Board Grid Subtle Framework (5x5 abstracted) -->
  <g stroke="#27272a" stroke-width="2.5" opacity="0.6">
    <!-- Grid Cells -->
    <rect x="96" y="96" width="60" height="60" rx="10" fill="#1c1c22" />
    <rect x="166" y="96" width="60" height="60" rx="10" fill="#1c1c22" />
    <rect x="236" y="96" width="60" height="60" rx="10" fill="#1c1c22" />
    <rect x="306" y="96" width="60" height="60" rx="10" fill="#1c1c22" />
    <rect x="376" y="96" width="60" height="60" rx="10" fill="#1c1c22" />

    <rect x="96" y="166" width="60" height="60" rx="10" fill="#1c1c22" />
    <rect x="166" y="166" width="60" height="60" rx="10" fill="#1c1c22" />
    <rect x="236" y="166" width="60" height="60" rx="10" fill="#1c1c22" />
    <rect x="306" y="166" width="60" height="60" rx="10" fill="#1c1c22" />
    <rect x="376" y="166" width="60" height="60" rx="10" fill="#1c1c22" />

    <rect x="96" y="236" width="60" height="60" rx="10" fill="#1c1c22" />
    <rect x="166" y="236" width="60" height="60" rx="10" fill="#1c1c22" />
    <rect x="236" y="236" width="60" height="60" rx="10" fill="#1c1c22" />
    <rect x="306" y="236" width="60" height="60" rx="10" fill="#1c1c22" />
    <rect x="376" y="236" width="60" height="60" rx="10" fill="#1c1c22" />

    <rect x="96" y="306" width="60" height="60" rx="10" fill="#1c1c22" />
    <rect x="166" y="306" width="60" height="60" rx="10" fill="#1c1c22" />
    <rect x="236" y="306" width="60" height="60" rx="10" fill="#1c1c22" />
    <rect x="306" y="306" width="60" height="60" rx="10" fill="#1c1c22" />
    <rect x="376" y="306" width="60" height="60" rx="10" fill="#1c1c22" />

    <rect x="96" y="376" width="60" height="60" rx="10" fill="#1c1c22" />
    <rect x="166" y="376" width="60" height="60" rx="10" fill="#1c1c22" />
    <rect x="236" y="376" width="60" height="60" rx="10" fill="#1c1c22" />
    <rect x="306" y="376" width="60" height="60" rx="10" fill="#1c1c22" />
    <rect x="376" y="376" width="60" height="60" rx="10" fill="#1c1c22" />
  </g>

  <!-- Glowing Barricade Walls -->
  <!-- Horizontal central barricade -->
  <rect x="162" y="230" width="138" height="14" rx="7" fill="url(#wallGrad)" stroke="#fde68a" stroke-width="2" filter="url(#wallGlow)" />
  <!-- Vertical barricade -->
  <rect x="300" y="232" width="14" height="138" rx="7" fill="url(#wallGrad)" stroke="#fde68a" stroke-width="2" filter="url(#wallGlow)" />

  <!-- Top Blue Pawn -->
  <circle cx="266" cy="126" r="28" fill="url(#blueGrad)" stroke="#bfdbfe" stroke-width="4" filter="url(#blueGlow)" />
  <circle cx="266" cy="126" r="14" fill="#93c5fd" opacity="0.8" />

  <!-- Bottom Red Pawn -->
  <circle cx="266" cy="406" r="28" fill="url(#redGrad)" stroke="#fecaca" stroke-width="4" filter="url(#redGlow)" />
  <circle cx="266" cy="406" r="14" fill="#fca5a5" opacity="0.8" />

  <!-- Center Trophy Star Accent -->
  <polygon points="266,242 270,252 281,253 273,260 276,271 266,265 256,271 259,260 251,253 262,252" fill="#fef08a" opacity="0.9" />
</svg>
